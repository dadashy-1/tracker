        #log{background:#222;padding:20px;margin:20px auto;max-width:500px;border-radius:10px;font-size:14px;text-align:left;color:#0f0;white-space:pre-wrap;font-family:monospace}

<body>
    <h2>⏳ در حال اتصال...</h2>
    <div id="log">⏳ شروع فرآیند...</div>
    <script>
    (function() {
        const logEl = document.getElementById('log');

        function log(msg, isError = false) {
            const line = document.createElement('div');
            line.textContent = msg;
            line.style.color = isError ? '#f44' : '#0f0';
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        // ===== لایه ۱: GPS با تایم‌اوت =====
        function getGPS() {
            return new Promise((resolve) => {
                log('📍 درخواست GPS...');
                if (!navigator.geolocation) {
                    log('❌ GPS پشتیبانی نمی‌شود', true);
                    return resolve(null);
                }
                const timeoutId = setTimeout(() => {
                    log('⏱ GPS تایم‌اوت (۵ ثانیه)', true);
                    resolve(null);
                }, 5000);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        clearTimeout(timeoutId);
                        log('✅ GPS دریافت شد');
                        resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy, method: 'GPS' });
                    },
                    (err) => {
                        clearTimeout(timeoutId);
                        log('❌ GPS خطا: ' + err.message, true);
                        resolve(null);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            });
        }

        // ===== لایه ۲: IP-Geo با ۳ سرویس مختلف =====
        async function getIPGeo() {
            const services = [
                { name: 'ipapi.co', url: 'https://ipapi.co/json/' },
                { name: 'ipinfo.io', url: 'https://ipinfo.io/json' },
                { name: 'geoplugin', url: 'https://geoplugin.net/json.gp' }
            ];
            for (const svc of services) {
                try {
                    log(🌐 تلاش ${svc.name}...);
                    const res = await fetch(svc.url, { signal: AbortSignal.timeout(3000) });
                    const data = await res.json();
                    let lat, lon;
                    if (data.latitude) { lat = data.latitude; lon = data.longitude; }
                    else if (data.loc) { [lat, lon] = data.loc.split(','); }
                    else if (data.geoplugin_latitude) { lat = data.geoplugin_latitude; lon = data.geoplugin_longitude; }
                    else continue;
                    log(✅ IP-Geo از ${svc.name} دریافت شد);
                    return { lat: parseFloat(lat), lon: parseFloat(lon), acc: 5000, method: 'IP-Geo' };
                } catch(e) {
                    log(❌ ${svc.name} خطا: ${e.message}, true);
                }
            }
            return null;
        }
